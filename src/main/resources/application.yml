# Configuration for the meetup-agent.
#
# Values support ${ENV_VAR:default} placeholders: the environment variable wins
# when set, otherwise the default after ':' is used.
telegram:
  # Secrets: never commit real values here. Provide them via environment
  # variables (e.g. in the local, git-ignored IDEA "MainKt" run configuration).
  # Bot token from @BotFather.
  botToken: ${TELEGRAM_BOT_TOKEN:}
  # Channel @username (public) or numeric chat id.
  chatId: ${TELEGRAM_CHAT_ID:}

meetup:
  city: ${MEETUP_CITY:Amsterdam}
  maxResults: ${MEETUP_MAX_RESULTS:15}
  # File used to remember which meetups were already posted, so re-runs don't
  # post duplicates to the channel. One Luma event id per line.
  cacheFile: ${MEETUP_CACHE_FILE:.meetup-cache/posted.txt}

llm:
  # Local LLM served by Ollama (no API key needed). The Koog AI agent talks to a
  # locally running model that supports tool calling. Pull it first with:
  #   ollama pull ministral-3:14b
  # Other good tool-capable options: llama3.1, mistral-nemo, qwen2.5:14b.
  # A blank value falls back to the default model (AppConfig.DEFAULT_MODEL).
  baseUrl: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${LLM_MODEL:ministral-3:14b}
